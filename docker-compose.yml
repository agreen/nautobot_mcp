# Standalone Nautobot MCP server (HTTP / streamable-http transport).
#
# To run it next to an existing Nautobot stack, use docker-compose.sidecar.yml instead.
#
#   cp .env.example .env     # set NAUTOBOT_ENV / URL / token
#   docker compose up -d --build
#   curl localhost:8000/health   # liveness: up as soon as the process is serving
#   curl localhost:8000/ready    # 503 until the endpoint + KB indexes are built
#   MCP endpoint: http://localhost:8000/mcp/
services:
  nautobot-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: nautobot-mcp:latest
    container_name: nautobot-mcp-server

    env_file:
      - path: .env
        required: false

    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false

    # The MCP endpoint has no authentication and can write to Nautobot with the
    # configured token, so publish it on loopback only.
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"

    volumes:
      # ChromaDB indexes + cloned knowledge-base repos survive restarts, so a restart
      # re-uses the existing index instead of re-embedding / re-cloning everything.
      - mcp-data:/data

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mcp-data:
    name: nautobot-mcp-data
